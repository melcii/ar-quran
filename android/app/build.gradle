plugins {
    id 'com.android.application'
}

android {
    namespace 'org.erguvan.arquran'
    compileSdk 35

    defaultConfig {
        applicationId 'org.erguvan.arquran'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        // A fixed demo key, so each new APK installs over the last one without uninstalling.
        // Not for a Play Store release, which needs a private key kept out of the repo.
        demo {
            storeFile file('demo.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.demo
        }
    }

    sourceSets {
        // The 3D scenes are the same web pages as the website, bundled so the app works offline.
        main.assets.srcDirs += ['../../web']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
